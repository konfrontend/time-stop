name: Release

on:
  push:
    # Plain vX.Y.Z only: the update check ignores pre-release versions.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # A tag pushed with GITHUB_TOKEN starts no workflow, so this path cannot hand off
  # to the one above: both triggers run this same workflow.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v — e.g. 0.2.0'
        required: true
        type: string

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Everything that can refuse a release happens here, before an artifact exists.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # Full history and tags: the ancestry and monotonic checks both need them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The tag filter does not apply to workflow_dispatch, so the shape is checked here.
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$version' is not X.Y.Z."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Released commit must be reachable from master
        run: |
          git fetch --no-tags --prune origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::$(git rev-parse HEAD) is not reachable from master."
            exit 1
          fi

      # A pushed tag is never moved or reused, so the version only ever goes up.
      - name: Version must move forward
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists."
            exit 1
          fi
          # grep exits 1 when the only tag is this one, which pipefail would take for a failure.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -vFx "$TAG" | sort -V | tail -n1 || true)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::$TAG does not come after $latest."
            exit 1
          fi

      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  dmg:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tag is the version; every package.json stays at 0.0.0 in git.
      - run: npm version "$VERSION" --no-git-tag-version --no-workspaces-update --workspace=@app/desktop
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
      - run: npx turbo build --filter=@app/desktop
      - run: npm run dist:mac --workspace=@app/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  exe:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm version "$VERSION" --no-git-tag-version --no-workspaces-update --workspace=@app/desktop
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
      - run: npx turbo build --filter=@app/desktop
      - run: npm run dist:win --workspace=@app/desktop
      # Stands in for the hands-on check nobody makes on Windows. See docs/release.md. The test
      # skips when the executable is unset, so the path is asserted before it can pass unrun.
      - name: Packaged smoke
        shell: bash
        run: |
          export DESKTOP_PACKAGED_APP="${{ github.workspace }}/apps/desktop/release/win-unpacked/$(node -p "require('./apps/desktop/package.json').productName").exe"
          test -f "$DESKTOP_PACKAGED_APP"
          npm run test:e2e:packaged --workspace=@app/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  image:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/time-stop-server
          # Taken from preflight, not the ref: on the dispatch path the ref is a branch.
          tags: type=raw,value=${{ needs.preflight.outputs.version }}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes only once every artifact exists, so a Release never lacks one.
  release:
    needs: [preflight, dmg, exe, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers: build-push-action also uploads a build record, and downloading
      # it has failed a release before.
      - uses: actions/download-artifact@v7
        with:
          pattern: '{dmg,exe}'
          merge-multiple: true
      - run: gh release create "$TAG" ./*.dmg ./*.exe --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
