name: Release

on:
  push:
    # Plain vX.Y.Z only: the update check ignores pre-release versions.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tag is the version; every package.json stays at 0.0.0 in git.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-workspaces-update --workspace=@time-stop/desktop
      - run: npx turbo build --filter=@time-stop/desktop
      - run: npm run dist --workspace=@time-stop/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/time-stop-server
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes only once both artifacts exist, so a Release never lacks its image.
  release:
    needs: [dmg, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dmg
      - run: gh release create "$GITHUB_REF_NAME" ./*.dmg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
