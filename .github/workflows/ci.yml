name: CI

on:
  push:
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: timestop
          POSTGRES_PASSWORD: timestop
          POSTGRES_DB: timestop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timestop -d timestop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://timestop:timestop@localhost:5432/timestop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo build lint typecheck test
      - run: npm run format:check
      - name: electron-builder dry run
        run: npm run package --workspace=@time-stop/desktop
