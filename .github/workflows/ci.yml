name: CI

on:
  push:

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations match the schemas
        run: |
          npm run db:generate -w @app/db
          git add -N packages/db/drizzle
          git diff --exit-code packages/db/drizzle
      - run: npm run format:check
      - run: npx turbo build lint typecheck test
      - name: electron-builder dry run
        run: npm run package --workspace=@app/desktop

  # Native modules and path handling break on Windows first; this catches it before a tag.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Everything the desktop app ships; the server is Linux-only and its tests want a container.
      - run: npx turbo build test --filter=...@app/desktop
      - name: electron-builder dry run
        run: npm run package --workspace=@app/desktop
