<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — GEM-116 Tracker + Dashboard</title>
<!--
  THROWAWAY PROTOTYPE — GEM-116, iteration 2. Not production code.

  Variant round is over. This is the composed winner:
    - Single window. Compact Tracker view by default; Dashboard / Settings as tabs
      that expand the SAME window in place (no second window, no tray popover).
    - Tray = bare minimum one-liner in the menu bar: status dot, timer, metadata.
    - Always-on-top is NOT on by default (shown as an off toggle).
    - Context switching: dedicated Workspace + Project pickers in the Tracker (A/C).
    - Timer affordance: big timer face + Name field + Start/Stop (A/C).
    - Manual entry lives on the Dashboard only; the Tracker only tracks.
    - Overlap: inline amber flag on list rows (A/B). Week grid dropped.

  Styling: Tailwind v4 browser CDN + shadcn/ui default (neutral) theme tokens and
  component recipes. Needs network for the CDN script; everything else is inline.
-->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /* shadcn/ui default neutral preset, verbatim defaults */
  :root {
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --wall: linear-gradient(160deg, oklch(0.87 0.02 270), oklch(0.9 0.02 320) 45%, oklch(0.89 0.015 180));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --popover: oklch(0.205 0 0);
      --popover-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      --wall: linear-gradient(160deg, oklch(0.25 0.02 270), oklch(0.24 0.025 320) 45%, oklch(0.23 0.015 180));
    }
  }
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: calc(var(--radius) - 4px);
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
  }

  body { background: var(--wall); }
  .tabular { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="min-h-screen text-foreground text-sm antialiased">

<div id="stage"></div>
<div id="dialog-root"></div>

<div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 rounded-full bg-neutral-900 px-3 py-1.5 text-xs text-neutral-100 shadow-lg">
  <span class="rounded-full bg-amber-400 px-2 py-0.5 text-[10px] font-extrabold tracking-wider text-neutral-900">PROTOTYPE</span>
  <span class="font-semibold">GEM-116 · single window, composed winner</span>
</div>

<script>
/* ==========================================================================
   DOMAIN — vocabulary from CONTEXT.md, rules from docs/data-hierarchy.md
   ========================================================================== */

const DAY = 86400000;
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const startOfWeek = d => { const x = startOfDay(d); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }; // Monday
const startOfMonth = d => { const x = startOfDay(d); x.setDate(1); return x; };

const state = {
  workspaces: [
    { id: 'w1', name: 'Work',     currency: 'USD' },
    { id: 'w2', name: 'Personal', currency: 'USD' },
    { id: 'w3', name: 'Study',    currency: 'USD' },
  ],
  clients: [
    { id: 'c1', ws: 'w1', name: 'Northwind' },
    { id: 'c2', ws: 'w1', name: 'Acme' },
  ],
  projects: [
    { id: 'p1', ws: 'w1', name: 'Northwind Redesign', client: 'c1', rate: 85,  color: '#d9614f', archived: false },
    { id: 'p2', ws: 'w1', name: 'Acme API',           client: 'c2', rate: 110, color: '#4f6bd9', archived: false },
    { id: 'p3', ws: 'w1', name: 'Internal Ops',       client: null, rate: null, color: '#7c8494', archived: false },
    { id: 'p4', ws: 'w2', name: 'Time Stop',          client: null, rate: null, color: '#2f9e6b', archived: false },
    { id: 'p5', ws: 'w2', name: 'Meditation',         client: null, rate: null, color: '#8b62d1', archived: false },
    { id: 'p6', ws: 'w3', name: 'Spanish',            client: null, rate: null, color: '#c39530', archived: false },
    { id: 'p7', ws: 'w1', name: 'Legacy Site',        client: 'c1', rate: 70,  color: '#9a8f7d', archived: true  },
  ],
  records: [],
  context: { ws: 'w1', project: 'p1' },   // Context = Workspace + optional Project selected in the UI
  timer: null,
  range: { kind: 'month', anchor: new Date() },
  filters: { ws: 'w1', project: null, client: null, billable: 'all' }, // Dashboard pre-filtered to the Context
};

const project = id => state.projects.find(p => p.id === id) || null;
const workspace = id => state.workspaces.find(w => w.id === id);
const client = id => state.clients.find(c => c.id === id) || null;
const clientOfRecord = r => { const p = project(r.project); return p && p.client ? client(p.client) : null; };
const currencyOf = r => workspace(r.ws).currency;

let seq = 0;
const uid = () => 'r' + (++seq);

function addRecord({ ws, project: pid, name, start, stop, billable }) {
  const p = pid ? project(pid) : null;
  const rec = {
    id: uid(),
    ws: p ? p.ws : ws,                       // with a Project, the Workspace is the Project's
    project: pid || null,
    name: name || '',
    start, stop,
    rate: p ? p.rate : null,                 // Rate copied from the Project and frozen
    billable: billable !== undefined ? billable : !!(p && p.rate), // defaults true only with a Rate
  };
  state.records.push(rec);
  return rec;
}

function startTimer() {
  if (state.timer) stopTimer();            // at most one Timer per Actor
  const { ws, project: pid } = state.context;
  state.timer = addRecord({ ws, project: pid, name: '', start: Date.now(), stop: null });
}
function stopTimer() {
  if (!state.timer) return;
  state.timer.stop = Date.now();
  state.timer = null;
}

const durationMs = r => (r.stop ?? Date.now()) - r.start;
const hoursOf = r => durationMs(r) / 3600000;
const amountOf = r => (r.billable && r.rate ? r.rate * hoursOf(r) : null); // Amount = Rate × hours

function overlaps() {                       // Overlap derived on read, never stored
  const out = new Set();
  const rs = state.records;
  for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) {
    const a = rs[i], b = rs[j];
    const ae = a.stop ?? Date.now(), be = b.stop ?? Date.now();
    if (a.start < be && b.start < ae) { out.add(a.id); out.add(b.id); }
  }
  return out;
}

function rangeBounds() {
  const { kind, anchor } = state.range;
  if (kind === 'week') { const s = startOfWeek(anchor); return [s, new Date(+s + 7 * DAY)]; }
  const s = startOfMonth(anchor);
  return [s, new Date(s.getFullYear(), s.getMonth() + 1, 1)];
}
function rangeLabel() {
  const [s, e] = rangeBounds();
  if (state.range.kind === 'week') {
    const last = new Date(+e - DAY);
    return `${s.toLocaleDateString(undefined,{day:'numeric',month:'short'})} – ${last.toLocaleDateString(undefined,{day:'numeric',month:'short'})}`;
  }
  return s.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
function stepRange(n) {
  const a = new Date(state.range.anchor);
  if (state.range.kind === 'week') a.setDate(a.getDate() + 7 * n); else a.setMonth(a.getMonth() + n);
  state.range.anchor = a;
}

function visibleRecords() {
  const [s, e] = rangeBounds();
  const f = state.filters;
  return state.records
    .filter(r => r.start >= +s && r.start < +e)
    .filter(r => !f.ws || r.ws === f.ws)
    .filter(r => !f.project || r.project === f.project)
    .filter(r => !f.client || (clientOfRecord(r) || {}).id === f.client)
    .filter(r => f.billable === 'all' || (f.billable === 'yes' ? r.billable : !r.billable))
    .sort((a, b) => b.start - a.start);
}

function totalsOf(list) {                   // totals bar counts the running Timer
  const t = { hours: 0, billableHours: 0, amounts: {} };
  for (const r of list) {
    const h = hoursOf(r);
    t.hours += h;
    if (r.billable) t.billableHours += h;
    const a = amountOf(r);
    if (a != null) { const c = currencyOf(r); t.amounts[c] = (t.amounts[c] || 0) + a; }
  }
  return t;
}

/* ==========================================================================
   FAKE DATA
   ========================================================================== */
function at(daysAgo, hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = startOfDay(new Date(Date.now() - daysAgo * DAY));
  d.setHours(h, m, 0, 0);
  return +d;
}
function mk(daysAgo, from, to, pid, name, billable) {
  addRecord({ ws: pid ? project(pid).ws : 'w1', project: pid, name, start: at(daysAgo, from), stop: at(daysAgo, to), billable });
}
mk(0, '09:15', '10:05', 'p2', 'Auth endpoint review');
mk(0, '09:50', '11:20', 'p1', 'Pricing page wireframes');      // overlaps the one above
mk(0, '13:00', '13:45', 'p4', 'Sync design notes');
mk(0, '14:00', '14:20', null, 'Email and invoicing');
mk(1, '10:00', '12:30', 'p1', 'Hero section');
mk(1, '13:30', '16:00', 'p1', '');                             // Name typed later — still empty
mk(1, '20:00', '20:40', 'p6', 'Duolingo streak');
mk(2, '09:00', '12:00', 'p2', 'Rate limiter');
mk(2, '12:00', '12:30', 'p3', 'Standup');
mk(2, '07:00', '07:20', 'p5', 'Morning sit');
mk(3, '09:30', '13:00', 'p2', 'Webhook retries');
mk(3, '14:00', '17:45', 'p1', 'Component pass', false);        // Billable turned off by hand
mk(5, '09:00', '13:00', 'p1', 'Design review with Northwind');
mk(5, '21:00', '22:30', 'p4', 'Prototype spike');
mk(7, '10:00', '15:00', 'p2', 'Data migration');
mk(9, '19:00', '19:50', 'p6', 'Grammar drills');
mk(12, '09:00', '12:00', 'p1', 'Kickoff');
mk(12, '13:00', '15:30', 'p7', 'Patch legacy contact form');   // Archived Project keeps its history

/* ==========================================================================
   FORMATTING
   ========================================================================== */
const pad = n => String(n).padStart(2, '0');
const clock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hms = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
};
const hm = ms => {
  const m = Math.max(0, Math.round(ms / 60000));
  return `${Math.floor(m / 60)}:${pad(m % 60)}`;
};
const hoursTxt = h => `${h.toFixed(2)} h`;
const money = (c, v) => `${v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${c}`;
const dayLabel = ms => {
  const d = startOfDay(new Date(ms)), t = startOfDay(new Date());
  const diff = Math.round((+t - +d) / DAY);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ==========================================================================
   SHADCN-FLAVOURED ATOMS (class recipes from the default preset)
   ========================================================================== */
const cls = {
  btn:        'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 cursor-pointer',
  btnPrimary: 'bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4',
  btnDestr:   'bg-destructive text-white hover:bg-destructive/90 h-9 px-4',
  btnOutline: 'border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 px-4',
  btnGhost:   'hover:bg-accent hover:text-accent-foreground h-8 px-2 text-muted-foreground',
  select:     'h-9 appearance-none rounded-md border border-input bg-transparent px-3 pr-8 text-sm outline-none focus-visible:ring-2 focus-visible:ring-ring cursor-pointer bg-no-repeat bg-[right_0.6rem_center] bg-[length:0.65rem] bg-[url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23888%27 stroke-width=%272%27%3E%3Cpath d=%27m6 9 6 6 6-6%27/%3E%3C/svg%3E")]',
  input:      'h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none placeholder:text-muted-foreground focus-visible:ring-2 focus-visible:ring-ring',
  label:      'text-xs font-medium text-muted-foreground',
  badge:      'inline-flex items-center gap-1 rounded-md px-1.5 py-0.5 text-[11px] font-semibold',
  tabsList:   'inline-flex h-9 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground',
  tabTrigger: 'inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all cursor-pointer',
  tabActive:  'bg-background text-foreground shadow-sm',
};

function projectLabel(r) {
  const p = project(r.project);
  if (!p) return `<span class="inline-flex items-center gap-1.5 text-muted-foreground text-xs whitespace-nowrap"><span class="size-2 rounded-full bg-muted-foreground/40"></span>No Project</span>`;
  const c = p.client ? client(p.client).name : null;
  return `<span class="inline-flex items-center gap-1.5 text-muted-foreground text-xs whitespace-nowrap"><span class="size-2 rounded-full" style="background:${p.color}"></span>${esc(p.name)}${c ? ` · ${esc(c)}` : ''}</span>`;
}
function billableToggle(r) {
  const rated = !!r.rate;
  // Billable stays visible but unobtrusive when the Project has no Rate
  const look = r.billable
    ? (rated ? 'border-emerald-600 text-emerald-600' : 'border-emerald-600/40 text-emerald-600/50 border-dashed')
    : (rated ? 'border-input text-muted-foreground/60' : 'border-input/60 text-muted-foreground/30 border-dashed');
  return `<button class="grid size-6 place-items-center rounded-md border text-[11px] font-bold cursor-pointer ${look}"
    title="${rated ? 'Billable' : 'Billable — this Project has no Rate'}"
    onclick="app.toggleBillable('${r.id}')">$</button>`;
}
const overlapFlag = () => `<span class="${cls.badge} bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-400">⚠ Overlap</span>`;

function contextPickers() {
  const ws = state.context.ws;
  const projects = state.projects.filter(p => p.ws === ws && !p.archived); // Archived hidden from pickers
  return {
    workspace: `<select class="${cls.select} w-full" onchange="app.setContextWs(this.value)">
        ${state.workspaces.map(w => `<option value="${w.id}" ${w.id === ws ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
      </select>`,
    project: `<select class="${cls.select} w-full" onchange="app.setContextProject(this.value)">
        <option value="">No Project</option>
        ${projects.map(p => `<option value="${p.id}" ${p.id === state.context.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>`,
  };
}

function filterBar() {
  const f = state.filters;
  const projects = state.projects.filter(p => !f.ws || p.ws === f.ws);
  const clients = state.clients.filter(c => !f.ws || c.ws === f.ws);
  const seg = (v, label) => `<button class="${cls.tabTrigger} h-7 ${f.billable === v ? cls.tabActive : ''}" onclick="app.setFilter('billable','${v}')">${label}</button>`;
  return `
    <select class="${cls.select}" onchange="app.setFilter('ws', this.value)">
      <option value="">All Workspaces</option>
      ${state.workspaces.map(w => `<option value="${w.id}" ${f.ws === w.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}
    </select>
    <select class="${cls.select}" onchange="app.setFilter('project', this.value)">
      <option value="">All Projects</option>
      ${projects.map(p => `<option value="${p.id}" ${f.project === p.id ? 'selected' : ''}>${esc(p.name)}${p.archived ? ' (Archived)' : ''}</option>`).join('')}
    </select>
    <select class="${cls.select}" onchange="app.setFilter('client', this.value)">
      <option value="">All Clients</option>
      ${clients.map(c => `<option value="${c.id}" ${f.client === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    </select>
    <div class="${cls.tabsList} h-9">${seg('all', 'All')}${seg('yes', 'Billable')}${seg('no', 'Non-billable')}</div>`;
}

function rangeNav() {
  const seg = (v, label) => `<button class="${cls.tabTrigger} h-7 ${state.range.kind === v ? cls.tabActive : ''}" onclick="app.setRangeKind('${v}')">${label}</button>`;
  return `<div class="flex items-center gap-1">
      <button class="${cls.btn} ${cls.btnGhost}" onclick="app.stepRange(-1)">‹</button>
      <span class="min-w-33 text-center font-semibold">${rangeLabel()}</span>
      <button class="${cls.btn} ${cls.btnGhost}" onclick="app.stepRange(1)">›</button>
    </div>
    <div class="${cls.tabsList} h-9">${seg('week', 'Week')}${seg('month', 'Month')}</div>`;
}

function totalsBar(list) {
  const t = totalsOf(list);
  const amounts = Object.entries(t.amounts);
  const cell = (label, v, live) => `<div class="flex flex-col">
    <span class="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground">${label}</span>
    <b class="tabular text-[15px]" ${live ? `data-live-total="${live}"` : ''}>${v}</b></div>`;
  return `<div class="flex flex-none items-center gap-6 border-t border-border bg-muted/40 px-4 py-2.5">
    ${cell('Total', hoursTxt(t.hours), 'hours')}
    ${cell('Billable', hoursTxt(t.billableHours), 'billable')}
    ${amounts.length ? amounts.map(([c, v]) => cell('Amount', money(c, v), 'amount')).join('') : cell('Amount', '—')}
    <div class="ml-auto flex items-center gap-3">
      <span class="text-muted-foreground">${list.length} Record${list.length === 1 ? '' : 's'}</span>
      <button class="${cls.btn} ${cls.btnOutline} h-8" onclick="app.exportNote()">Export…</button>
    </div>
  </div>`;
}

/* ==========================================================================
   TRAY — bare minimum one-liner: status dot, timer, metadata when it fits
   ========================================================================== */
function menubar() {
  const running = !!state.timer;
  const t = running ? hms(durationMs(state.timer)) : '00:00:00';
  const p = running ? (state.timer.project ? project(state.timer.project).name : 'No Project') : 'Standby';
  return `<div class="flex h-6.5 items-center gap-3.5 border-b border-black/5 bg-white/55 px-3 text-[11.5px] text-neutral-700 backdrop-blur dark:border-white/10 dark:bg-neutral-900/60 dark:text-neutral-300">
    <b>Time Stop</b><span>File</span><span>Record</span><span>Window</span><span>Help</span>
    <span class="ml-auto"></span>
    <span class="inline-flex items-center gap-1.5 tabular" title="Tray one-liner: status, timer, metadata">
      <span class="size-1.75 rounded-full ${running ? 'bg-emerald-500' : 'bg-neutral-400'}"></span>
      <span data-elapsed>${t}</span>
      <span class="text-neutral-500 dark:text-neutral-400">· ${esc(p)}</span>
    </span>
  </div>`;
}

/* ==========================================================================
   THE ONE WINDOW — compact Tracker by default; Dashboard/Settings expand it in place
   ========================================================================== */
function shell() {
  const tab = ui.tab;
  const compact = tab === 'tracker';
  const trigger = (k, label) => `<button class="${cls.tabTrigger} flex-1 ${tab === k ? cls.tabActive : ''}" onclick="app.tab('${k}')">${label}</button>`;

  return `<div class="relative min-h-screen pb-21">
    ${menubar()}
    <div class="mx-auto mt-9 flex flex-col overflow-hidden rounded-xl border border-border bg-card text-card-foreground shadow-2xl transition-all duration-300"
         style="width:${compact ? 'min(92vw, 320px)' : 'min(94vw, 1000px)'}; height:${compact ? 'auto' : 'min(78vh, 640px)'}">

      <div class="flex h-8.5 flex-none select-none items-center gap-2 border-b border-border bg-muted/40 px-2.5">
        <div class="flex gap-1.5">
          <span class="size-2.75 rounded-full bg-[#ec6a5e]"></span>
          <span class="size-2.75 rounded-full bg-[#f4bf4f]"></span>
          <span class="size-2.75 rounded-full bg-[#61c554]"></span>
        </div>
        <span class="text-xs font-semibold text-muted-foreground">Time Stop</span>
        <button class="ml-auto inline-flex items-center gap-1 text-[10.5px] text-muted-foreground/60 cursor-pointer" title="Off by default; opt-in"
          onclick="app.togglePin()">${ui.pinned ? '📌 on top' : '📍 pin'}</button>
      </div>

      <div class="flex-none px-3 pt-3">
        <div class="${cls.tabsList} flex w-full">${trigger('tracker', 'Tracker')}${trigger('dashboard', 'Dashboard')}${trigger('settings', 'Settings')}</div>
      </div>

      ${tab === 'tracker' ? trackerView() : tab === 'dashboard' ? dashboardView() : settingsView()}
    </div>
  </div>`;
}

function trackerView() {
  const running = state.timer;
  const ctx = contextPickers();
  return `<div class="flex flex-col gap-3.5 p-4">
    <div class="flex flex-col gap-1.5">
      <span class="${cls.label}">Context — Workspace</span>
      ${ctx.workspace}
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="${cls.label}">Context — Project</span>
      ${ctx.project}
    </div>

    <div class="py-1.5 text-center">
      <div class="tabular text-[38px] font-semibold tracking-tight ${running ? '' : 'text-muted-foreground/40'}" data-elapsed>
        ${running ? hms(durationMs(running)) : '00:00:00'}
      </div>
      <div class="min-h-4 text-[11.5px] text-muted-foreground">${running ? 'Timer running' : 'Ready'}</div>
    </div>

    <input class="${cls.input}" placeholder="${running ? 'Name this Record…' : 'Name (optional)'}"
      value="${esc(running ? running.name : '')}" oninput="app.setTimerName(this.value)" ${running ? '' : 'disabled'} />

    ${running
      ? `<button class="${cls.btn} ${cls.btnDestr} h-11" onclick="app.stop()">Stop</button>`
      : `<button class="${cls.btn} ${cls.btnPrimary} h-11" onclick="app.start()">Start</button>`}

    <div class="mt-1 flex flex-col gap-2 border-t border-border pt-3">
      <div class="flex items-center gap-1.5 text-[11px] text-muted-foreground">
        <span>Global start/stop</span>
        <kbd class="rounded border border-border px-1 text-[10.5px]">⌃⌥ Space</kbd>
      </div>
      <span class="text-[11px] text-muted-foreground">Today: <b class="tabular">${hoursTxt(todayHours())}</b></span>
    </div>
  </div>`;
}

function dashboardView() {
  const list = visibleRecords();
  const over = overlaps();
  const groups = groupByDay(list);
  return `
    <div class="flex flex-none flex-wrap items-center gap-2 border-b border-border px-4 py-2.5">${rangeNav()}
      <button class="${cls.btn} ${cls.btnOutline} ml-auto" onclick="app.openManual()">+ Add Record</button>
    </div>
    <div class="flex flex-none flex-wrap items-center gap-2 border-b border-border px-4 py-2.5">${filterBar()}</div>
    <div class="min-h-0 flex-1 overflow-auto">
      ${groups.length ? groups.map(g => `
        <div class="border-b border-border">
          <div class="sticky top-0 flex items-center gap-2.5 bg-muted/60 px-4 py-1.5 backdrop-blur">
            <span class="font-semibold">${dayLabel(g.day)}</span>
            <span class="ml-auto tabular text-muted-foreground">${hoursTxt(g.records.reduce((s, r) => s + hoursOf(r), 0))}</span>
          </div>
          ${g.records.map(r => `
            <div class="flex items-center gap-2.5 border-t border-border px-4 py-2 hover:bg-accent/50 ${r.stop ? '' : 'bg-emerald-500/5'}">
              <span class="min-w-0 flex-1 truncate ${r.name ? '' : 'italic text-muted-foreground/60'}">${esc(r.name || 'No Name yet')}</span>
              ${projectLabel(r)}
              ${over.has(r.id) ? overlapFlag() : ''}
              <span class="tabular whitespace-nowrap text-xs text-muted-foreground/70">${clock(r.start)}–${r.stop ? clock(r.stop) : 'now'}</span>
              ${billableToggle(r)}
              <span class="tabular min-w-14 text-right font-semibold" ${r.stop ? '' : 'data-elapsed-hm'}>${hm(durationMs(r))}</span>
              <span class="tabular min-w-18 text-right text-muted-foreground">${amountOf(r) != null ? money(currencyOf(r), amountOf(r)) : ''}</span>
            </div>`).join('')}
        </div>`).join('') : `<div class="p-10 text-center text-muted-foreground">No Records in this Range.</div>`}
    </div>
    ${totalsBar(list)}`;
}

function settingsView() {
  return `<div class="flex max-w-130 flex-col gap-4 p-5">
    <span class="${cls.label} uppercase tracking-wider">Server</span>
    <div class="flex flex-col gap-1.5">
      <span class="${cls.label}">Server URL</span>
      <input class="${cls.input}" value="https://timestop.example.dev" />
    </div>
    <div class="flex flex-col gap-1.5">
      <span class="${cls.label}">Token</span>
      <input class="${cls.input}" value="tst_••••••••••••••••" />
    </div>
    <span class="text-muted-foreground">17 Changes pushed · queue empty</span>
  </div>`;
}

/* ==========================================================================
   HELPERS
   ========================================================================== */
function groupByDay(list) {
  const map = new Map();
  for (const r of list) {
    const k = +startOfDay(new Date(r.start));
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  return [...map.entries()].sort((a, b) => b[0] - a[0]).map(([day, records]) => ({ day, records }));
}
function todayHours() {
  const d0 = +startOfDay(new Date());
  return state.records.filter(r => r.start >= d0).reduce((s, r) => s + hoursOf(r), 0);
}

/* ==========================================================================
   MANUAL ENTRY — Dashboard only; the Tracker only tracks
   ========================================================================== */
function renderDialog() {
  const root = document.getElementById('dialog-root');
  if (!ui.manualOpen) { root.innerHTML = ''; return; }
  const ws = state.context.ws;
  const projects = state.projects.filter(p => p.ws === ws && !p.archived);
  const today = new Date().toISOString().slice(0, 10);
  const field = (label, control) => `<div class="flex flex-col gap-1.5">${label ? `<span class="${cls.label}">${label}</span>` : ''}${control}</div>`;
  root.innerHTML = `<div class="fixed inset-0 z-40 grid place-items-center bg-black/40" onclick="if(event.target===this) app.closeManual()">
    <div class="flex w-95 flex-col gap-3 rounded-xl border border-border bg-popover p-4 text-popover-foreground shadow-2xl">
      <div class="font-semibold">Add a Record by hand</div>
      ${field('Date', `<input id="m-date" type="date" value="${today}" class="${cls.input}" />`)}
      <div class="grid grid-cols-2 gap-3">
        ${field('Start', `<input id="m-start" value="09:00" class="${cls.input}" />`)}
        ${field('Stop', `<input id="m-stop" value="10:30" class="${cls.input}" />`)}
      </div>
      ${field('Project', `<select id="m-project" class="${cls.select} w-full">
          <option value="">No Project</option>
          ${projects.map(p => `<option value="${p.id}" ${p.id === state.context.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>`)}
      ${field('Name', `<input id="m-name" placeholder="Optional — can be filled in later" class="${cls.input}" />`)}
      <div class="mt-1 flex justify-end gap-2">
        <button class="${cls.btn} ${cls.btnOutline}" onclick="app.closeManual()">Cancel</button>
        <button class="${cls.btn} ${cls.btnPrimary}" onclick="app.saveManual()">Add Record</button>
      </div>
      <span class="text-[11.5px] text-muted-foreground">
        Inherits Workspace <b>${esc(workspace(ws).name)}</b> from the Context. Billable follows the Project's Rate.
      </span>
    </div>
  </div>`;
}

/* ==========================================================================
   APP ACTIONS
   ========================================================================== */
const ui = { tab: 'tracker', pinned: false, manualOpen: false };

const app = {
  start() { startTimer(); render(); },
  stop() { stopTimer(); render(); },
  setTimerName(v) { if (state.timer) state.timer.name = v; },   // no re-render: keeps focus in the input
  setContextWs(v) {
    state.context.ws = v;
    const p = project(state.context.project);
    if (!p || p.ws !== v) state.context.project = null;         // Project must belong to the Workspace
    state.filters.ws = v;                                       // Dashboard stays pre-filtered to the Context
    state.filters.project = null; state.filters.client = null;
    render();
  },
  setContextProject(v) { state.context.project = v || null; render(); },
  setFilter(k, v) {
    state.filters[k] = v || null;
    if (k === 'billable') state.filters.billable = v;
    if (k === 'ws') { state.filters.project = null; state.filters.client = null; }
    render();
  },
  stepRange(n) { stepRange(n); render(); },
  setRangeKind(k) { state.range.kind = k; render(); },
  toggleBillable(id) {
    const r = state.records.find(x => x.id === id);
    if (r) r.billable = !r.billable;
    render();
  },
  tab(k) { ui.tab = k; render(); },
  togglePin() { ui.pinned = !ui.pinned; render(); },
  openManual() { ui.manualOpen = true; renderDialog(); },
  closeManual() { ui.manualOpen = false; renderDialog(); },
  saveManual() {
    const d = document.getElementById('m-date').value;
    const s = document.getElementById('m-start').value;
    const e = document.getElementById('m-stop').value;
    const pid = document.getElementById('m-project').value || null;
    const name = document.getElementById('m-name').value;
    const mk2 = t => { const [h, m] = t.split(':').map(Number); const x = new Date(d + 'T00:00:00'); x.setHours(h, m, 0, 0); return +x; };
    addRecord({ ws: state.context.ws, project: pid, name, start: mk2(s), stop: mk2(e) });
    ui.manualOpen = false; renderDialog(); render();
  },
  exportNote() { alert('Export turns this exact view (Range + filters) into one CSV Report. Out of scope for this prototype — settled by GEM-115.'); },
};
window.app = app;

function render() { document.getElementById('stage').innerHTML = shell(); }

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable || t.tagName === 'SELECT')) return;
  if (e.code === 'Space' && e.ctrlKey && e.altKey) { e.preventDefault(); state.timer ? app.stop() : app.start(); } // the global hotkey, faked
});

// tick only the live bits, so open selects and focused inputs survive
setInterval(() => {
  if (!state.timer) return;
  const el = hms(durationMs(state.timer));
  document.querySelectorAll('[data-elapsed]').forEach(n => n.textContent = el);
  document.querySelectorAll('[data-elapsed-hm]').forEach(n => n.textContent = hm(durationMs(state.timer)));
  const t = totalsOf(visibleRecords());
  document.querySelectorAll('[data-live-total="hours"]').forEach(n => n.textContent = hoursTxt(t.hours));
  document.querySelectorAll('[data-live-total="billable"]').forEach(n => n.textContent = hoursTxt(t.billableHours));
}, 1000);

render();
</script>
</body>
