# Never change appId or productName; they pin where the database lives. See docs/release.md.
appId: dev.gembag.time-stop
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
asar: true
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
  artifactName: time-stop-${version}-${arch}.${ext}
  # Ad-hoc signed; hardened runtime would reject Electron's frameworks and only notarization needs it.
  identity: '-'
  hardenedRuntime: false
win:
  target: dir
nsis:
  # An uninstall leaves the database behind, so a reinstall finds the Records where it left them.
  deleteAppDataOnUninstall: false
linux:
  target: dir
