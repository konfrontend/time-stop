# Never change appId or productName; they pin where the database lives. See docs/release.md.
appId: dev.gembag.time-stop
artifactName: time-stop-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
asar: true
npmRebuild: false
# Placeholder artwork. See docs/release.md.
icon: resources/icon.png
mac:
  target:
    - target: dmg
      arch: arm64
  # Ad-hoc signed; hardened runtime would reject Electron's frameworks and only notarization needs it.
  identity: '-'
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: x64
nsis:
  # Per-user, so installing needs no admin rights and upgrades replace the install in place.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  # An uninstall leaves the database behind, so a reinstall finds the Records where it left them.
  deleteAppDataOnUninstall: false
linux:
  target: dir
