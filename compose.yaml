services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://timestop:timestop@postgres:5432/timestop
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: timestop
      POSTGRES_PASSWORD: timestop
      POSTGRES_DB: timestop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timestop -d timestop']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
